<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>فاست كوم — نظام إدارة نقل الحاويات</title>
    <base href="/" />

    <!-- 🎨 Favicon — مونوجرام FC بأزرق الهوية (مؤقتًا لحد ما اللوجو يتجهز) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B56DF'/%3E%3Ctext x='32' y='43' font-family='Arial, sans-serif' font-size='27' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3EFC%3C/text%3E%3C/svg%3E" />

    <!-- MudBlazor -->
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />

    <!-- 🔤 خط Cairo — عربي + أرقام واضحة -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
          rel="stylesheet" />

    <link rel="stylesheet" href="css/app.css" />
</head>
<body>

    <div id="app">
        <!-- ⏳ D10: Loading Screen بالبراند — بدل الـ Splash Screen -->
        <div id="fastcom-loading">
            <div class="loading-mark">FC</div>
            <div class="loading-title">فاست كوم</div>
            <div class="loading-sub">نظام إدارة نقل الحاويات والموانئ</div>
            <div class="loading-bar"></div>
            <div class="loading-hint">جاري تحميل النظام…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        حصل خطأ غير متوقع.
        <a href="" class="reload">أعد التحميل</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- 🔐 تخزين الـ Token (localStorage) — لازم قبل Blazor -->
    <script src="js/fastcom-storage.js"></script>

    <script src="_framework/blazor.webassembly.js"
            autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <script>
        // ── نشغّل Blazor، ولما يخلص نخفي شاشة التحميل ─────────────────────────
        Blazor.start().then(function () {
            var el = document.getElementById('fastcom-loading');
            if (el) {
                setTimeout(function () {
                    el.classList.add('done');
                    setTimeout(function () { el.remove(); }, 500);
                }, 350);
            }
        });
    </script>

    <style>
        #blazor-error-ui {
            background: #D64545;
            color: #fff;
            bottom: 0;
            box-shadow: 0 -2px 12px rgba(0,0,0,.2);
            display: none;
            right: 0;
            padding: 12px 20px;
            position: fixed;
            width: 100%;
            z-index: 10000;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        }
        #blazor-error-ui a { color: #fff; }
        #blazor-error-ui .reload { color: #fff; font-weight: 700; text-decoration: underline; margin-inline: 8px; }
        #blazor-error-ui .dismiss { position: absolute; left: 16px; top: 10px; cursor: pointer; }
    </style>
</body>
</html>
